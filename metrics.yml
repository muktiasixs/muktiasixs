# Minimal config: fokus AniList & Last.fm, non-aktifkan plugin berat
base: header

# AniList
plugin_anilist: yes
plugin_anilist_user: muktiasixs
plugin_anilist_medias: anime,manga
plugin_anilist_sections: watching,reading,favorites

# Musik (Last.fm)
plugin_music: yes
plugin_music_provider: lastfm
plugin_music_lastfm_user: m14n6
plugin_music_limit: 5

# Non-aktifkan plugin berat untuk percepat build
plugin_lines: no
plugin_languages: no
plugin_activity: no
plugin_repositories: no
plugin_achievements: no
plugin_topics: no
