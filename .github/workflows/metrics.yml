name: Generate metrics
permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' 
  push:
    branches: [ main ]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run lowlighter/metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: metrics.svg

          # --- Kirim konfigurasi langsung sebagai inputs supaya action pakai ini ---
          base: header
          # AniList plugin
          plugin_anilist: yes
          plugin_anilist_user: muktiasixs
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites, characters
          plugin_anilist_limit_characters: 22


          # Disable heavy plugins for speed
          plugin_music: no
          plugin_lines: no
          plugin_languages: no
          plugin_activity: no
          plugin_repositories: no
          plugin_lines: no
          plugin_languages: no
          plugin_activity: no
          plugin_repositories: no
          plugin_topics: no
          plugin_achievements: no
          plugin_people: no
          plugin_contributors: no
          plugin_wakatime: no
          plugin_stackoverflow: no
          plugin_leetcode: no
          plugin_tweets: no
          plugin_posts: no
        env:
          # Tambahkan secrets jika plugin eksternal butuh (beri nanti)
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}

      - name: Commit generated files (fallback)
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore(metrics): update generated metrics"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
