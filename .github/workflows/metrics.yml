name: Generate metrics

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run lowlighter/metrics
        uses: lowlighter/metrics@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config: metrics.yml
