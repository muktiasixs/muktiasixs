name: Generate metrics

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run lowlighter/metrics
        uses: lowlighter/metrics@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config: metrics.yml
        env:
          # Tambahkan secrets di repo jika diperlukan oleh tool; hapus yang tidak perlu
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore(metrics): update generated metrics"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
