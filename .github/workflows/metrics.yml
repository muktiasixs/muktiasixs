name: Generate metrics

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run lowlighter/metrics
        uses: lowlighter/metrics@v3.34   # <- pakai tag rilis yang valid (atau @latest)
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config: metrics.yml
          filename: metrics.svg
        env:
          # Tambahkan secrets ini nanti jika diperlukan oleh plugin (Anda bilang akan beri kalau perlu)
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
          LASTFM_API_KEY: ${{*](#)
